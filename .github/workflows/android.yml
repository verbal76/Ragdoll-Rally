name: Android Launch POC

# Native generation G2: Godot 4.7.1, Gradle build route, targetSdk 36.
# (The G1 line, Godot 4.4.1 / API 34, lives on branch ccr-7c0d7291-e3d5o1 with releases launch-poc-b2..b6.)
on:
  push:
    branches: [claude/launch-api36-modernization, claude/launch-expanded-playfield, claude/launch-mayhem-upgrades, claude/launch-gameplay-pivot]
    paths:
      - 'launch/**'
      - 'release/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_BASE: https://github.com/godotengine/godot/releases/download/4.7.1-stable
  GODOT_TPL_DIR: .local/share/godot/export_templates/4.7.1.stable
  SIGNING_CERT_SHA256: 32a3988d6348d9eedcc95b40202d5f35e3b0a4d96ac042319de0f7ca7e3dc15b

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The PUBLIC version is supplied ONCE, in release/release.json. Everything below (release title,
      # APK filename, About/diagnostics, release notes, Android versionName) is derived from it.
      # A release is published only when release.json says "deliver": true AND v<version> has not been released.
      - name: Read public version (release/release.json)
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import json;print(json.load(open('release/release.json'))['version'])")
          PRODUCT=$(python3 -c "import json;print(json.load(open('release/release.json'))['product'])")
          STEM=$(python3 -c "import json;print(json.load(open('release/release.json'))['file_stem'])")
          REQ=$(python3 -c "import json;print(str(json.load(open('release/release.json'))['deliver']).lower())")
          EXISTS=false
          if gh release view "v$V" >/dev/null 2>&1; then EXISTS=true; fi
          DELIVER=false
          if [ "$REQ" = "true" ] && [ "$EXISTS" = "false" ] && [ "${{ github.event_name }}" = "push" ]; then DELIVER=true; fi
          if [ "$REQ" = "true" ] && [ "$EXISTS" = "true" ]; then echo "::warning::v$V is already released; bump release/release.json to publish a new build"; fi
          SHA7=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "$DELIVER" = "true" ]; then
            VNAME="v$V"; LABEL="v$V"; APK="$STEM-v$V.apk"; KIND=release
          else
            VNAME="v$V-internal"; LABEL="v$V (internal test build, not delivered)"; APK="$STEM-v$V-internal-$SHA7.apk"; KIND=internal
          fi
          {
            echo "version=$V"; echo "product=$PRODUCT"; echo "stem=$STEM"; echo "deliver=$DELIVER"
            echo "vname=$VNAME"; echo "label=$LABEL"; echo "apk=$APK"; echo "kind=$KIND"
          } >> "$GITHUB_OUTPUT"
          echo "public version v$V ($KIND) -> $APK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Godot downloads
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-4.7.1-dl-v1

      - name: Download Godot and export templates
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          [ -f godot.zip ] || curl -fsSL -o godot.zip "$GODOT_BASE/Godot_v4.7.1-stable_linux.x86_64.zip"
          [ -f templates.tpz ] || curl -fsSL -o templates.tpz "$GODOT_BASE/Godot_v4.7.1-stable_export_templates.tpz"
          unzip -o -q godot.zip
          sudo install -m 755 Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          T="$HOME/$GODOT_TPL_DIR"
          mkdir -p "$T"
          unzip -o -j -q templates.tpz 'templates/android_*' 'templates/version.txt' -d "$T"
          ls -la "$T"; cat "$T/version.txt"

      - name: Android SDK packages (API 36, build-tools 36.1.0, NDK r29)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" "cmdline-tools;latest" > /dev/null
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" "$ANDROID_HOME/ndk"

      - name: Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/launch/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOS
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.7.tres
          cat ~/.config/godot/editor_settings-4.7.tres

      - name: Install Android Gradle build template
        run: |
          T="$HOME/$GODOT_TPL_DIR"
          mkdir -p launch/android/build
          unzip -q "$T/android_source.zip" -d launch/android/build
          echo "4.7.1.stable" > launch/android/.build_version
          touch launch/android/build/.gdignore
          sed -n 1,25p launch/android/build/config.gradle
          grep -E "distributionUrl" launch/android/build/gradle/wrapper/gradle-wrapper.properties || true

      - name: Set version
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"${{ steps.rel.outputs.vname }}\"/" launch/export_presets.cfg
          grep -E '^version/|gradle_build/' launch/export_presets.cfg

      - name: Write build identity (build_info.json)
        run: |
          CFG=launch/android/build/config.gradle
          TARGET=$(sed -n "s/^ *targetSdk *: *\([0-9]*\).*/\1/p" $CFG | head -1)
          MIN=$(sed -n "s/^ *minSdk *: *\([0-9]*\).*/\1/p" $CFG | head -1)
          COMPILE=$(sed -n "s/^ *compileSdk *: *\([0-9]*\).*/\1/p" $CFG | head -1)
          echo "template targetSdk=$TARGET minSdk=$MIN compileSdk=$COMPILE"
          test "$TARGET" = "36"
          python3 launch/tools/ota_tools.py build-info --out launch/build_info.json \
            --version-name "${{ steps.rel.outputs.vname }}" --public-version "${{ steps.rel.outputs.label }}" --product-name "${{ steps.rel.outputs.product }}" --build-kind ${{ steps.rel.outputs.kind }} --version-code ${{ github.run_number }} --sha "$GITHUB_SHA" \
            --run ${{ github.run_number }} --channel poc-g2 --target-sdk "$TARGET" --min-sdk "$MIN" --compile-sdk "$COMPILE" \
            --generation "Godot 4.7.1, Gradle build, Android API 36" \
            --manifest-url "https://github.com/${{ github.repository }}/releases/download/launch-ota-channel-poc-g2/manifest.json" \
            --signing "debug (throwaway key; not Play-ready)" --build-type debug
          cat launch/build_info.json

      - name: Import project
        run: godot --headless --path launch --import || true

      - name: Verify (game)
        run: godot --headless --path launch -s tests/verify.gd

      - name: Verify (OTA / About / applying-update state machine)
        run: godot --headless --path launch -s tests/verify_ota.gd

      - name: Verify (Hot Attic Games studio splash - canonical asset, order, timing, fit, transparency, resume, failure)
        run: godot --headless --path launch -s tests/verify_splash.gd

      - name: Verify (gameplay pivot - characters, upgrades, skipping, ricochet, limbs, fire, explosions, selector)
        run: godot --headless --path launch -s tests/verify_pivot.gd

      - name: Verify (b9 city map - aim mapping, targets, camera, reset)
        run: godot --headless --path launch -s tests/verify_expanded.gd

      - name: Physics regression vs Godot 4.4.1 reference
        run: |
          godot --headless --path launch -s tests/physics_baseline.gd -- "$GITHUB_WORKSPACE/physics_ci.json"
          python3 launch/tools/physics_compare.py docs/physics/baseline_godot_4.4.1.json physics_ci.json

      - name: Export APK (Gradle)
        id: export
        run: |
          APK="${{ steps.rel.outputs.apk }}"
          mkdir -p build
          godot --headless --path launch --export-debug "Android" "../build/$APK"
          ls -la build
          test -s "build/$APK"
          echo "apk=build/$APK" >> "$GITHUB_OUTPUT"
          echo "name=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK artifact (identity, SDK, signing, native libs, 16 KB)
        run: |
          python3 launch/tools/verify_apk.py "${{ steps.export.outputs.apk }}" \
            --package com.hotatticgames.ragdollrally.launch --version-name "${{ steps.rel.outputs.vname }}" \
            --version-code ${{ github.run_number }} --min-sdk 24 --target-sdk 36 \
            --cert-sha256 "$SIGNING_CERT_SHA256" --json-out build/apk_report.json | tee build/apk_report.txt
          python3 - <<'PY'
          import json
          r = json.load(open("build/apk_report.json"))
          assert "android.permission.INTERNET" in r["permissions"], r["permissions"]
          assert r["abis"] == ["arm64-v8a"], r["abis"]
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.export.outputs.name }}
          path: |
            ${{ steps.export.outputs.apk }}
            build/apk_report.json

      - name: Release notes + checksum (delivered builds only)
        if: steps.rel.outputs.deliver == 'true'
        run: |
          python3 release/make_notes.py "${{ steps.export.outputs.apk }}" build/release_notes.md "$GITHUB_SHA" "${{ github.run_number }}" "${{ github.run_number }}" "Godot 4.7.1" 36
          (cd build && sha256sum "${{ steps.export.outputs.name }}" > "${{ steps.export.outputs.name }}.sha256")
          cp build/apk_report.json "build/${{ steps.rel.outputs.stem }}-v${{ steps.rel.outputs.version }}-build-report.json"
          cat build/release_notes.md

      # GitHub Release: title "<Product> v<N>", tag v<N>, marked LATEST (not a pre-release).
      - name: Publish release (delivered builds only)
        if: steps.rel.outputs.deliver == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          name: ${{ steps.rel.outputs.product }} v${{ steps.rel.outputs.version }}
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body_path: build/release_notes.md
          files: |
            ${{ steps.export.outputs.apk }}
            ${{ steps.export.outputs.apk }}.sha256
            build/${{ steps.rel.outputs.stem }}-v${{ steps.rel.outputs.version }}-build-report.json
