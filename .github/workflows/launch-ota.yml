name: Launch OTA publish

# MANUAL ONLY. Publishing an OTA makes installed apps on that channel discover it on their next launch, so it is never triggered by a push,
# merge, tag or pull request. A run needs (1) a human dispatch from the authoritative branch, (2) the exact confirmation phrase, and
# (3) the SHA-256 of launch/ota/publish_request.json, so the person authorizing has seen exactly what will be published.
# Compute it with:  sha256sum launch/ota/publish_request.json
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: PUBLISH OTA'
        type: string
        required: true
      request_sha256:
        description: 'SHA-256 of launch/ota/publish_request.json as committed on this branch'
        type: string
        required: true

concurrency:
  group: launch-ota-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GODOT_BASE: https://github.com/godotengine/godot/releases/download/4.7.1-stable

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # payload epochs and ancestry need the full authoritative history (and the release tags)

      - name: Policy gate (authoritative branch only, see docs/ENGINEERING_POLICY.md)
        run: python3 tools/check_policy.py --ci

      - name: Download Godot (no export templates needed for a PCK)
        run: |
          curl -fsSL -o godot.zip "$GODOT_BASE/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -o -q godot.zip
          sudo install -m 755 Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import + test
        run: |
          godot --headless --path launch --import || true
          godot --headless --path launch -s tests/verify.gd
          godot --headless --path launch -s tests/verify_ota.gd
          godot --headless --path launch -s tests/verify_ota_safety.gd
          python3 launch/tools/test_ota_tools.py

      - name: Authorization (confirmation phrase + request hash) and request resolution
        env:
          IN_CONFIRM: ${{ inputs.confirm }}
          IN_HASH: ${{ inputs.request_sha256 }}
        run: |
          [ "$IN_CONFIRM" = "PUBLISH OTA" ] || { echo "::error::confirmation phrase missing or wrong; nothing published"; exit 1; }
          ACTUAL=$(sha256sum launch/ota/publish_request.json | cut -d' ' -f1)
          [ "$IN_HASH" = "$ACTUAL" ] || { echo "::error::request_sha256 does not match the committed publish_request.json ($ACTUAL); nothing published"; exit 1; }
          # publish_request.json: {"name", "channel", optional "source_ref" (a tag/SHA ON the authoritative history; default = this commit),
          #                        optional "rollback_reason" + "rollback_floor_epoch" (deliberate downgrade, see docs/ENGINEERING_POLICY.md)}
          # values go through the environment, never interpolated into shell text
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re
          r = json.load(open("launch/ota/publish_request.json"))
          assert re.fullmatch(r"[a-z0-9][a-z0-9-]{0,30}", r["channel"]), "channel must be lowercase letters, digits and dashes"
          for k, v in (("REQ_NAME", r["name"]), ("REQ_CHANNEL", r["channel"]), ("REQ_REF", r.get("source_ref", "")),
                       ("REQ_ROLLBACK", r.get("rollback_reason", "")), ("REQ_ROLLBACK_FLOOR", str(r.get("rollback_floor_epoch", "")))):
              assert "\n" not in str(v), k
              print("%s=%s" % (k, v))
          PY

      - name: Select the payload source (exact SHA, authoritative history only)
        id: src
        run: |
          if [ -n "$REQ_REF" ]; then SRC_SHA=$(git rev-parse "$REQ_REF^{commit}"); else SRC_SHA="$GITHUB_SHA"; fi
          git merge-base --is-ancestor "$SRC_SHA" "$GITHUB_SHA" || { echo "OTA source $SRC_SHA is not part of the authoritative history"; exit 1; }
          if [ "$SRC_SHA" = "$GITHUB_SHA" ]; then DIR="$GITHUB_WORKSPACE"; else git worktree add "$RUNNER_TEMP/otasrc" "$SRC_SHA"; DIR="$RUNNER_TEMP/otasrc"; fi
          echo "sha=$SRC_SHA" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "OTA payload source: $SRC_SHA (epoch $(python3 launch/tools/ota_tools.py epoch --rev "$SRC_SHA")) in $DIR"

      - name: Build OTA pack + manifest
        id: pack
        run: |
          SRC_SHA="${{ steps.src.outputs.sha }}"
          SRC_DIR="${{ steps.src.outputs.dir }}"
          SHA7=$(echo "$SRC_SHA" | cut -c1-7)
          SEQ=${{ github.run_number }}
          CH="$REQ_CHANNEL"
          ID="${CH}-${SEQ}-${SHA7}"
          mkdir -p out
          godot --headless --path "$SRC_DIR/launch" --import || true
          godot --headless --path "$SRC_DIR/launch" --export-pack "Launch OTA Pack" "$GITHUB_WORKSPACE/out/launch-ota-${ID}.pck"
          test -s "out/launch-ota-${ID}.pck"
          URL="https://github.com/${{ github.repository }}/releases/download/launch-ota-${ID}/launch-ota-${ID}.pck"
          RBARGS=()
          if [ -n "$REQ_ROLLBACK" ]; then RBARGS=(--rollback-reason "$REQ_ROLLBACK" --rollback-floor "$REQ_ROLLBACK_FLOOR"); fi
          python3 launch/tools/ota_tools.py manifest --out out/manifest.json --pck "out/launch-ota-${ID}.pck" \
            --id "$ID" --name "$REQ_NAME" --sequence "$SEQ" --sha "$SRC_SHA" --root "$SRC_DIR/launch" \
            --epoch "$(python3 launch/tools/ota_tools.py epoch --rev "$SRC_SHA")" \
            --channel "$CH" --url "$URL" "${RBARGS[@]}"
          cat out/manifest.json
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "channel=$CH" >> "$GITHUB_OUTPUT"

      - name: OTA safety guard (never older than a native baseline, never a lower sequence than the live channel)
        run: |
          curl -fsSL -o live.json "https://github.com/${{ github.repository }}/releases/download/launch-ota-channel-${{ steps.pack.outputs.channel }}/manifest.json" || rm -f live.json
          python3 launch/tools/ota_tools.py guard --manifest out/manifest.json --live live.json --auth-ref "$GITHUB_SHA"

      - name: Publish immutable OTA release + move channel pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID="${{ steps.pack.outputs.id }}"
          CH="${{ steps.pack.outputs.channel }}"
          gh release create "launch-ota-${ID}" "out/launch-ota-${ID}.pck" "out/manifest.json" \
            --title "Launch OTA ${ID} - ${REQ_NAME}" --prerelease \
            --notes "OTA payload. Source ${{ steps.src.outputs.sha }} (published from commit ${GITHUB_SHA}). Channel ${CH}. Applies only to native builds whose runtime_compat matches manifest.json." \
            --target "$GITHUB_SHA"
          POINTER="launch-ota-channel-${CH}"
          gh release view "$POINTER" >/dev/null 2>&1 || gh release create "$POINTER" --title "Launch OTA channel: ${CH}" --prerelease \
            --notes "Channel pointer. manifest.json here is replaced on each OTA publish." --target "$GITHUB_SHA"
          gh release upload "$POINTER" out/manifest.json --clobber
