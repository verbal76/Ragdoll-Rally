name: Release retrofit (one-off)

# Runs when release/retrofit_request.json changes. Idempotent. Re-presents already-built, verified binaries under the
# public "<Product> v<N>" convention WITHOUT rebuilding them (see docs/RELEASES.md).
# Budget policy: the retrofit is finished history, so it no longer runs on pushes - manual only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrofit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrofit releases
        run: python3 release/retrofit.py
